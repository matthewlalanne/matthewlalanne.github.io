<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"><style>
:root{--ink:#0E1220;--text:#2A3140;--muted:#667085;--line:#E4E7EE;--paper:#fff;--soft:#F5F6F8;--accent:#2B63F0;--accent-d:#7EA0FF;--font:'Geist',system-ui,-apple-system,sans-serif;--ease:cubic-bezier(.05,.7,.1,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--text);background:var(--paper);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.measure{max-width:720px}
h1,h2,h3{margin:0;color:var(--ink);font-weight:600;letter-spacing:-0.015em;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(34px,4.6vw,52px)}
h2{font-size:28px}
h3{font-size:22px}
p{margin:0 0 16px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.note{background:#fff3cd;color:#664d03;font-size:14px;padding:10px 24px;border-bottom:1px solid #ffe69c}
/* nav */
.nav{background:var(--ink)}
.nav .wrap{display:flex;justify-content:space-between;align-items:center;min-height:64px}
.nav a{color:#fff;text-decoration:none;font-weight:500;font-size:15px;display:inline-flex;align-items:center;min-height:44px}
.nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.nav ul a{color:var(--accent-d);padding:0 12px}
.nav ul a[aria-current]{color:#fff;text-decoration:underline;text-underline-offset:6px}
/* hero */
.hero{background:var(--ink);color:#fff;padding:96px 0}
.hero h1{color:#fff;max-width:18ch}
.hero p{font-size:19px;line-height:1.5;color:#c7cde0;max-width:660px;margin:24px 0 0}
.btns{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:500;font-size:15px;border:0;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.28)}
/* sections */
.sec{padding:96px 0}
.sec.soft{background:var(--soft)}
.sec+.sec{border-top:1px solid var(--line)}
.head{margin-bottom:48px}
.label{font-size:13px;font-weight:500;color:var(--accent);margin-bottom:12px;letter-spacing:.02em}
.head p{color:var(--muted);font-size:18px;margin:12px 0 0;max-width:660px}
/* project rows (text-only, public) */
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 2fr auto;gap:24px;align-items:baseline;padding:28px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.row h3{font-size:22px;transition:color .15s}
.row:hover h3{color:var(--accent);text-decoration:underline;text-underline-offset:5px}
.row .what{font-size:17px;color:var(--text);margin:0}
.row .who{font-size:14px;color:var(--muted);margin-top:4px}
.row .tag{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
/* about */
.about{display:grid;grid-template-columns:3fr 2fr;gap:72px}
.facts{display:grid;gap:14px;align-content:start}
.facts div{font-size:14px;color:var(--muted);padding-top:12px;border-top:1px solid var(--line)}
.facts b{display:block;color:var(--ink);font-weight:500;font-size:16px}
/* case study */
.cs{background:var(--ink);color:#fff;padding:96px 0}
.cs .label{color:var(--accent-d)}
.cs h1{color:#fff;max-width:20ch;font-size:clamp(30px,4vw,44px)}
.cs .sub{font-size:19px;color:#c7cde0;max-width:660px;margin:20px 0 0;line-height:1.5}
.cs .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:40px}
.cs .meta div{font-size:14px;color:#a3acc2;padding-top:12px;border-top:1px solid rgba(255,255,255,.14)}
.cs .meta b{display:block;color:#fff;font-weight:500;font-size:16px}
.cs .conf{font-size:14px;color:#a3acc2;margin-top:28px}
.overview{display:grid;grid-template-columns:3fr 2fr;gap:72px;align-items:start}
.stats{display:grid;gap:4px}
.stats div{padding:16px 0;border-top:1px solid var(--line)}
.stats div:first-child{border-top:0;padding-top:0}
.stats b{display:block;font-size:36px;font-weight:600;color:var(--ink);line-height:1.1}
.stats i{font-style:normal;color:var(--muted);font-size:16px;font-weight:400}
.stats span{font-size:14px;color:var(--muted)}
/* figures */
.fig{margin:0 0 48px;max-width:820px}
.fig .frame{border-radius:10px;border:1px solid var(--line);overflow:hidden;background:#fff;box-shadow:0 12px 40px rgba(14,18,32,.08)}
.fig img{display:block;width:100%;height:auto}
.fig.tall .frame{aspect-ratio:4/3}
.fig.tall img{height:100%;object-fit:cover;object-position:top}
.fig figcaption{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:12px;font-size:14px;color:var(--muted)}
.enlarge{font:inherit;font-weight:500;font-size:13px;color:var(--accent);background:none;border:1px solid var(--line);border-radius:999px;min-height:36px;padding:0 12px;cursor:pointer;white-space:nowrap}
.enlarge:hover{border-color:var(--accent)}
.dec{display:grid;grid-template-columns:minmax(0,820px) 1fr;gap:48px;align-items:start;margin-bottom:64px}
.dec .text h3{margin-bottom:12px}
.dec .text p{font-size:16px}
.dec .text .trade{font-size:15px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.steps div{padding-top:12px;border-top:2px solid var(--ink)}
.steps b{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px}
.steps strong{display:block;font-weight:600;color:var(--ink);margin-bottom:4px}
.steps p{font-size:15px;color:var(--muted);margin:0}
/* lightbox */
dialog.lb{border:0;padding:0;background:transparent;max-width:min(1200px,96vw);max-height:100dvh;width:auto}
dialog.lb::backdrop{background:rgba(14,18,32,.86)}
dialog.lb .box{background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;max-height:96dvh}
dialog.lb .bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 16px 12px 20px;border-bottom:1px solid var(--line)}
dialog.lb .bar p{margin:0;font-size:14px;color:var(--text)}
dialog.lb .close{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer;color:var(--ink)}
dialog.lb .body{overflow:auto;padding:0}
dialog.lb img{display:block;width:100%;height:auto}
:root:has(dialog[open]){overflow:hidden;scrollbar-gutter:stable}
/* reveal: opt-in, JS-gated, section-level only */
@media (prefers-reduced-motion:no-preference){
  html.js .reveal{opacity:0;transform:translateY(16px);transition:opacity 400ms var(--ease),transform 400ms var(--ease)}
  html.js .reveal.in{opacity:1;transform:none}
  html.js .stagger>*{opacity:0;transform:translateY(12px);transition:opacity 400ms var(--ease),transform 400ms var(--ease);transition-delay:calc(var(--i,0)*60ms)}
  html.js .stagger.in>*{opacity:1;transform:none}
  dialog.lb[open]{animation:lbin 200ms var(--ease)}
  @keyframes lbin{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
}
@media (max-width:1100px){.dec{grid-template-columns:1fr}}
@media (max-width:820px){.about,.overview,.dec{grid-template-columns:1fr}.row{grid-template-columns:1fr;gap:6px}.cs .meta,.steps{grid-template-columns:1fr 1fr}.sec,.hero,.cs{padding:64px 0}.nav ul li:nth-child(n+4){display:none}}

.facts span{font-size:13px;color:var(--muted);display:block}
.facts b{display:block;color:var(--ink);font-weight:500;font-size:16px;margin-top:2px}
.facts small{display:block;font-size:14px;color:var(--muted);margin-top:2px}
footer{padding:64px 0;border-top:1px solid var(--line);color:var(--muted);font-size:15px}

.contact{padding:96px 0;background:var(--soft);border-top:1px solid var(--line)}
.contact h2{font-size:clamp(28px,3.6vw,40px);max-width:18ch}
.contact p{font-size:18px;color:var(--muted);margin:16px 0 0;max-width:560px}
.cs-next{padding:48px 0;border-top:1px solid var(--line)}
.cs-next a{text-decoration:none;color:var(--ink);font-weight:600;font-size:22px}
.cs-next small{display:block;color:var(--muted);font-size:14px;margin-bottom:6px}
.cs-next a:hover{color:var(--accent)}
.week{display:grid;grid-template-columns:80px 1fr;gap:24px;align-items:start;padding:20px 0;border-top:1px solid var(--line)}
.week:last-child{border-bottom:1px solid var(--line)}
.wk{font-size:13px;font-weight:500;color:var(--accent);padding-top:4px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.days div{padding-top:8px;border-top:2px solid var(--ink)}
.days b{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:4px}

.days p{font-size:13px;color:var(--muted);margin:0;line-height:1.45}
@media (max-width:820px){.week{grid-template-columns:1fr;gap:8px}.days{grid-template-columns:1fr 1fr}}
.rounds{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px}
.rounds div{padding-top:12px;border-top:2px solid var(--ink);font-size:15px;color:var(--muted)}
.rounds b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}
.takes{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.takes b{display:block;color:var(--ink);font-weight:600;font-size:18px;margin-bottom:8px}
.takes p{font-size:16px;color:var(--muted);margin:0}
.diff{margin-top:48px;padding:24px 28px;border-left:2px solid var(--accent);background:var(--paper);max-width:720px}
.diff b{display:block;color:var(--ink);font-weight:600;margin-bottom:6px}
.diff p{margin:0;font-size:16px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:720px}
.pair .fig{margin:0}.pair .fig .frame{aspect-ratio:3/4}.pair .fig.phone .frame{background:var(--soft)}.pair .fig.phone img{object-fit:contain;object-position:center top;padding:16px}.pair .fig img{height:100%;object-fit:cover;object-position:top}
.gatehint{font-size:14px;color:var(--muted)}
.hero h1 .aside{display:block;font-size:17px;font-weight:400;color:#a3acc2;letter-spacing:0;margin-top:16px;line-height:1.5}
.ab{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:72px;align-items:start}
.ab .photo{border-radius:10px;overflow:hidden;box-shadow:0 12px 40px rgba(14,18,32,.08)}
.ab .photo img{display:block;width:100%;height:auto}
.ab .facts{margin-top:32px}
.plain{max-width:720px}
.plain h2{margin:48px 0 16px}
.plain h2:first-child{margin-top:0}
.slot{border:1px dashed var(--line);border-radius:10px;padding:48px 24px;text-align:center;color:var(--muted);font-size:14px;margin:0 0 48px}
@media (max-width:820px){.ab{grid-template-columns:1fr}.ab .photo{max-width:400px}}
@media (max-width:820px){.rounds,.takes{grid-template-columns:1fr}.pair{grid-template-columns:1fr}}
.feat{padding:96px 0;border-top:1px solid var(--line)}
.feat .grid{display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:72px;align-items:center}

.feat .mini{display:flex;gap:32px;margin:28px 0 32px;flex-wrap:wrap}
.feat .mini b{display:block;font-size:28px;font-weight:600;color:var(--ink);line-height:1.1}

.rc dialog.lb{max-width:min(520px,96vw)}
.phones{display:grid;gap:24px;margin:0 0 56px}
.phones.n2{grid-template-columns:repeat(2,minmax(0,1fr));max-width:560px}
