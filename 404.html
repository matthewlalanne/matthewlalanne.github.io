<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"><style>

.projects{display:grid;gap:80px}

.quote{font-size:22px;color:var(--ink);text-align:center;max-width:760px;margin:0 auto;font-weight:400}
.quote::before{content:"\201C"}.quote::after{content:"\201D"}

.next a{font-size:24px;text-decoration:none;color:var(--ink)}
.next small{display:block;color:var(--muted);font-size:14px;margin-bottom:8px}
footer{padding:64px 0 48px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:15px}

.about{max-width:760px;margin:0 auto}
